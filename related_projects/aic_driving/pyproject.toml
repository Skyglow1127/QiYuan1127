[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-drive"
version = "0.1.0"
description = "Reproducible delayed-observation driving experiments"
requires-python = ">=3.11"
dependencies = ["highway-env", "numpy", "matplotlib", "imageio", "imageio-ffmpeg"]

[project.optional-dependencies]
learning = ["torch"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
