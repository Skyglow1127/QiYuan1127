%YAML:1.0
---
# Paths relative to this file. YOLO segmentation plus unknown-object depth components.
# Profile for the AIPC direct USB view captured on 2026-10-17; verify ROI after moving camera.
detection_mode: "fusion"
rtdetr_model: "../models/rtdetrv2_r18_416.onnx"
rtdetr_confidence: 0.50
# hybrid: always = same-frame verification, fallback = only if YOLO has no allowed object.
hybrid_policy: "always"
segmentation_model: "../models/yolo26n-seg.onnx"
segmentation_names: "../models/yolo26n-seg.names"
weights: "../yolov4.weights"
model: "../yolov4.cfg"
names: "../coco.names"
output: "../output/aipc_usb_tabletop"
input_size: 416
cpu_threads: 4
color_width: 640
color_height: 480
fps: 30
continuous: 1
detection_interval_ms: 0
# Keep original preprocessing by default; enable for A/B evaluation.
letterbox: 0
confidence: 0.35
nms_iou: 0.45
# Empty means all COCO classes; e.g. [ "bottle", "cup" ]. Generic boxes are not a COCO class.
classes: []
excluded_grasp_classes: [ "person" ]
max_rgbd_skew_ms: 25.
max_export_age_ms: 2000.
min_depth_m: 0.15
max_depth_m: 1.5
plane_threshold_m: 0.006
min_object_height_m: 0.008
max_object_height_m: 0.25
min_plane_ratio: 0.30
min_valid_depth_ratio: 0.25
min_object_pixels: 40
# PLACEHOLDER, NOT a D1-T specification. Set the actual gripper limit before use.
max_gripper_opening_m: 0.080
finger_margin_m: 0.005
handeye_file: ""
robot_pose_file: ""
pose_tolerance_ms: 100.

# Scene profile: clear tabletop on the right of the red block; current camera is tilted.
# ROI affects plane fitting only; do not use unchanged after repositioning camera.
table_roi_normalized: [ 0.62, 0.62, 0.32, 0.30 ]
min_table_normal_z: 0.35  # Current oblique tabletop has |normal_z| about 0.46.
max_missing_boundary_ratio: 0.20
refine_unknown_rgb_contour: 1  # Appearance estimate only; does not fill missing depth.
