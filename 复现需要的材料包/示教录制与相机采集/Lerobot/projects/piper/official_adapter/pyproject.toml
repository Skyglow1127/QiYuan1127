[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_piper_shared"
version = "0.1.0"
description = "Receive-only shared-CAN PiPER hardware adapters for official LeRobot recording"
requires-python = ">=3.12"
dependencies = ["lerobot==0.6.1"]

[tool.setuptools.package-data]
lerobot_robot_piper_shared = ["*.json"]
